# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Used by `just changelog` to capture commits into release notes.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

body = """

{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/Kostassoid/avrox/compare/{{ release.previous.version | trim_start_matches(pat="v") }}...{{ release.version | trim_start_matches(pat="v") }}
{% endif -%}
{% endfor -%}
"""
trim = true
render_always = true

[git]
conventional_commits = true
# Include commits that do not follow the conventional commits specification.
filter_unconventional = false
require_conventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^refactor", group = "<!-- 2 -->Changed" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^doc", group = "<!-- 4 -->Documentation" },
    { message = "^style", group = "<!-- 5 -->Styling" },
    { message = "^test", group = "<!-- 6 -->Testing" },
    { message = "^build", group = "<!-- 7 -->Build" },
    { message = "^ci", group = "<!-- 8 -->CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^revert", group = "<!-- 9 -->Miscellaneous" },
    { message = ".*", group = "<!-- 10 -->Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
sort_commits = "oldest"
