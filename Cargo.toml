[workspace]
resolver = "3"
members = ["crates/avrox", "crates/avrox-cli"]

[workspace.package]
version = "1.0.1"
authors = ["Konstantin Alexandroff <k.alexandroff@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Kostassoid/avrox"

[workspace.dependencies]
avrox = { path = "crates/avrox", version = "1.0.1" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-release configuration: version all crates in lockstep and cut a
# single release for the workspace with a "v{version}" tag (the tag format
# 'dist' expects for a unified announcement).
# See https://github.com/crate-ci/cargo-release
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
# Releases go to GitHub Releases only, not crates.io.
publish = false
