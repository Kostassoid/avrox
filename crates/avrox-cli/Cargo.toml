[package]
name = "avrox-cli"
description = "Command line tool for generating code from Avro schemas."
keywords = ["avro", "schema", "codegen", "cli"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apache-avro.workspace = true
avrox.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# cargo-release configuration for this package. The changelog replacement is
# scoped here (relative to this package, running exactly once per release)
# because a workspace-level replacement would run for every package.
[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1
